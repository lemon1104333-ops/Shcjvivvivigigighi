<style>
:root{--bg:#1a1020;--bg2:#3a1c2e;--fg:#f8eedd;--card:#00000055;--acc:#ffb347;--line:#06c755;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif}
body{background:linear-gradient(var(--bg),var(--bg2));min-height:100vh}
#w{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
#top{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
#ico{font-size:44px;text-align:center;letter-spacing:6px}
.card{background:var(--card);border-radius:14px;padding:16px;line-height:1.8;font-size:16px}
.card p{margin:0 0 8px}
.msg{background:#fff;color:#222;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.6;border-left:6px solid var(--line)}
.msg b{display:block;font-size:12px;color:#06a047}
.loc{margin-top:6px;background:#eef6ee;border-radius:10px;padding:8px 10px;font-size:14px}
.call{text-align:center;font-size:18px;padding:12px;border-radius:14px;background:#2a6;color:#fff}
button{font:inherit;font-size:16px;color:var(--fg);background:#ffffff1a;border:2px solid var(--acc);border-radius:14px;padding:14px;text-align:left;cursor:pointer;line-height:1.5}
button:active{background:var(--acc);color:#222}
#ch{display:flex;flex-direction:column;gap:10px}
.end{text-align:center;font-size:26px;font-weight:bold}
#ico{display:none}
.stage{display:none;position:relative;height:140px;background:#ffffff14;border-radius:14px;overflow:hidden}
.ground{position:absolute;bottom:0;left:0;right:0;height:20px;background:#2b1a24}
.doll{position:absolute;bottom:16px;width:44px;height:96px;transition:left 1.2s ease}
.doll .h{width:32px;height:32px;border-radius:50%;background:#ffd9b0;margin:22px auto 0;position:relative;box-shadow:inset 0 9px 0 var(--hair)}
.doll .h::before,.doll .h::after{content:"";position:absolute;top:18px;width:4px;height:4px;border-radius:50%;background:#222}
.doll .h::before{left:9px}.doll .h::after{right:9px}
.doll .b{width:28px;height:34px;border-radius:12px 12px 6px 6px;margin:2px auto 0}
.nm{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
.say{display:none;position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#fff;color:#c00;font-weight:bold;font-size:13px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.talk .say{display:block}
.arm{position:absolute;top:56px;width:8px;height:26px;border-radius:4px;transform-origin:50% 3px}
.arm.l{left:2px}.arm.r{right:2px}
.leg{position:absolute;bottom:0;width:9px;height:14px;background:#333;border-radius:3px;transform-origin:50% 0}
.leg.l{left:12px}.leg.r{right:12px}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes step{0%,100%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}}
@keyframes wave{0%,100%{transform:rotate(150deg)}50%{transform:rotate(190deg)}}
@keyframes jump{40%{transform:translateY(-30px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.idle{animation:bob 2s ease-in-out infinite}
.walk{animation:bob .4s infinite}
.walk .leg.l,.walk .arm.r{animation:step .4s infinite}
.walk .leg.r,.walk .arm.l{animation:step .4s infinite reverse}
.phone .arm.r{transform:rotate(160deg)}
.phone .arm.r::after{content:"";position:absolute;bottom:-4px;left:-3px;width:12px;height:16px;background:#222;border:2px solid #6cf;border-radius:3px}
.wave .arm.r{animation:wave .5s infinite}
.jump{animation:jump .6s infinite}
.jump .arm.r{transform:rotate(160deg)}.jump .arm.l{transform:rotate(-160deg)}
.shock{animation:shake .15s infinite}
.shock .arm.r{transform:rotate(150deg)}.shock .arm.l{transform:rotate(-150deg)}
